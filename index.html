<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Help Desk Legends</title>
<style>
  /* Layout: a full-screen picture sits behind one narrow column. The start, play, and end screens swap in place inside that column. */
  :root {
    color-scheme: light;
    --ink: #2B2A33;
    --paper: #FFF9EC;
    --paper-soft: #F3EBD3;
    --muted: #5F5B6B;
    --teal: #2F8F9D;
    --teal-deep: #1F6A75;
    --good: #BFE8B4;
    --good-deep: #2E7D32;
    --miss: #FBE3A8;
    --stamp: #C0392B;
    --wall: #2F8F9D;
    --desk: #C98B4B;
    /* The picture is 400 by 700. It fills the height of a wide screen and the width of a narrow one, and the desk line sits 290 / 700 of the way down it. */
    --scene-height: min(100vh, 175vw);
    --desk-line: calc(var(--scene-height) * 0.4143);
    --font-display: ui-rounded, "Arial Rounded MT Bold", "Segoe UI Variable Display", "Segoe UI", system-ui, sans-serif;
    --font-body: ui-rounded, "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
    --font-mono: ui-monospace, "Cascadia Mono", Consolas, Menlo, monospace;
  }

  *, *::before, *::after { box-sizing: border-box; }
  [hidden] { display: none !important; }

  html { background: var(--desk); }

  body {
    margin: 0;
    color: var(--ink);
    font-family: var(--font-body);
    font-size: 17px;
    line-height: 1.4;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }

  /* The picture behind the game. The wall and desk colors fill the whole screen, and the drawing sits centered on top of them. It never takes taps. */
  .scene {
    position: fixed;
    inset: 0;
    z-index: 0;
    pointer-events: none;
    overflow: hidden;
    background: linear-gradient(var(--wall) 0, var(--wall) var(--desk-line), var(--desk) var(--desk-line), var(--desk) 100%);
  }

  .scene svg {
    position: absolute;
    top: 0;
    left: 50%;
    height: var(--scene-height);
    aspect-ratio: 400 / 700;
    transform: translateX(-50%);
    display: block;
  }

  .app {
    position: relative;
    z-index: 1;
    max-width: 480px;
    margin: 0 auto;
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    padding-block: 12px 28px;
  }

  .bar {
    display: flex;
    align-items: center;
    gap: 8px;
    min-height: 48px;
    font-family: var(--font-mono);
    font-size: 14px;
    font-weight: 700;
  }

  .counts {
    display: flex;
    justify-content: space-between;
    gap: 8px;
    margin-top: 8px;
    font-family: var(--font-mono);
    font-size: 14px;
    font-weight: 700;
  }

  .counts span {
    background: var(--ink);
    color: var(--paper);
    padding: 6px 12px;
    border-radius: 999px;
  }

  /* The gap that lets the picture show above the card. */
  .peek.tall { flex: 0 0 auto; height: max(130px, calc(var(--desk-line) - 156px)); }

  .panel {
    background: rgba(255, 249, 236, 0.95);
    border: 3px solid var(--ink);
    border-radius: 16px;
    box-shadow: 6px 6px 0 var(--ink);
    padding: 18px 18px 20px;
  }

  h1 {
    font-family: var(--font-display);
    font-size: 34px;
    line-height: 1.05;
    margin: 0 0 8px;
    letter-spacing: -0.5px;
  }

  h2 {
    font-family: var(--font-display);
    font-size: 20px;
    line-height: 1.2;
    margin: 10px 0 12px;
  }

  p { margin: 0 0 10px; }
  .small { font-size: 14px; color: var(--muted); }

  .tag {
    font-family: var(--font-mono);
    font-size: 12.5px;
    font-weight: 700;
    letter-spacing: 0.4px;
    text-transform: uppercase;
    color: var(--teal-deep);
    margin: 0 0 6px;
  }

  .lengths { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 14px 0 16px; }

  button {
    font: inherit;
    color: var(--ink);
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
  }

  .length {
    min-height: 72px;
    background: var(--paper);
    border: 3px solid var(--ink);
    border-radius: 12px;
    padding: 8px 4px;
    line-height: 1.15;
  }

  .length b { display: block; font-family: var(--font-display); font-size: 26px; }
  .length span { font-size: 13px; }
  .length[aria-pressed="true"] { background: var(--ink); color: var(--paper); }

  .go {
    display: block;
    width: 100%;
    min-height: 56px;
    background: var(--teal);
    color: #FFFFFF;
    font-family: var(--font-display);
    font-size: 20px;
    font-weight: 700;
    border: 3px solid var(--ink);
    border-radius: 12px;
    box-shadow: 4px 4px 0 var(--ink);
  }

  .go:active { transform: translate(2px, 2px); box-shadow: 2px 2px 0 var(--ink); }
  .go.quiet { background: var(--paper); color: var(--ink); margin-top: 12px; box-shadow: none; }

  .answers { display: grid; gap: 10px; }

  .answer {
    display: flex;
    align-items: center;
    gap: 12px;
    width: 100%;
    min-height: 54px;
    text-align: left;
    background: var(--paper);
    border: 3px solid var(--ink);
    border-radius: 12px;
    padding: 8px 12px;
    line-height: 1.25;
  }

  .answer .letter {
    flex: 0 0 30px;
    height: 30px;
    display: grid;
    place-items: center;
    background: var(--ink);
    color: var(--paper);
    border-radius: 50%;
    font-family: var(--font-mono);
    font-weight: 700;
    font-size: 15px;
  }

  .answer:disabled { cursor: default; color: var(--ink); opacity: 0.55; }
  .answer.right { background: var(--good); opacity: 1; animation: pop 0.45s ease-out; }
  .answer.right .letter { background: var(--good-deep); }
  .answer.picked-wrong { background: var(--miss); opacity: 1; }

  .feedback { margin-top: 14px; }

  .verdict {
    font-family: var(--font-display);
    font-weight: 700;
    font-size: 19px;
    margin-bottom: 4px;
  }

  .stamp {
    display: inline-block;
    font-family: var(--font-mono);
    font-weight: 700;
    font-size: 15px;
    letter-spacing: 1px;
    color: var(--stamp);
    border: 3px solid var(--stamp);
    border-radius: 6px;
    padding: 2px 8px;
    margin-right: 8px;
    transform: rotate(-6deg);
    animation: stamp 0.4s ease-out;
  }

  .score-big { font-family: var(--font-display); font-size: 56px; font-weight: 700; line-height: 1; margin: 6px 0 2px; }
  .rank { font-family: var(--font-display); font-size: 24px; font-weight: 700; color: var(--teal-deep); margin-bottom: 6px; }

  .sound {
    margin-left: auto;
    min-height: 48px;
    padding: 0 14px;
    background: var(--paper);
    border: 3px solid var(--ink);
    border-radius: 999px;
    font-family: var(--font-mono);
    font-size: 14px;
    font-weight: 700;
  }

  .sound[aria-pressed="false"] { background: var(--paper-soft); color: var(--muted); }

  /* The four small pictures for a call sit in three rows of two places, above, between, and below the two cards, and tuck a little way behind them. */
  .panel { position: relative; z-index: 1; }
  .pics { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; height: 104px; margin: -3px 0; position: relative; z-index: 0; }
  .pics:first-of-type { margin-top: 4px; }
  .pic { display: grid; place-items: center; min-width: 0; }
  .pic svg { height: 98px; width: auto; max-width: 100%; display: block; overflow: visible; }

  .sound.look { margin-left: 0; }

  /* The two-digit readout, built from seven bars per digit. It shows only in the retro look, where it is the score card. */
  .readout { display: none; gap: 4px; padding: 5px 7px; background: #010803; border: 3px solid var(--ink); }
  .readout svg { width: 20px; height: 33px; display: block; }
  .readout .seg { fill: #0F2A17; }
  .readout .seg.on { fill: #39FF6A; }

  /* The retro look: a green-on-black terminal. It swaps the colors and the type, squares every corner, tints the pictures green, and lays faint scan lines over the page. */
  :root[data-look="retro"] {
    --ink: #39FF6A;
    --paper: #031207;
    --paper-soft: #0A2412;
    --muted: #1FA348;
    --teal: #0A2412;
    --teal-deep: #39FF6A;
    --good: #39FF6A;
    --good-deep: #031207;
    --miss: #0A2412;
    --stamp: #39FF6A;
    --font-display: var(--font-mono);
    --font-body: var(--font-mono);
    color-scheme: dark;
  }

  :root[data-look="retro"], :root[data-look="retro"] .scene { background: #020A05; }
  :root[data-look="retro"] * { border-radius: 0 !important; }
  :root[data-look="retro"] body { text-shadow: 0 0 6px rgba(57, 255, 106, 0.55); font-size: 16px; }
  :root[data-look="retro"] h1 { font-size: 29px; letter-spacing: 0; }
  :root[data-look="retro"] .panel { background: #031207; box-shadow: 0 0 16px rgba(57, 255, 106, 0.45); }
  :root[data-look="retro"] .go { color: var(--ink); }
  :root[data-look="retro"] .answer.right { color: #031207; text-shadow: none; }
  :root[data-look="retro"] .answer.right .letter { color: #39FF6A; }
  :root[data-look="retro"] .readout { display: flex; }
  :root[data-look="retro"] .pic svg, :root[data-look="retro"] .scene svg { filter: grayscale(1) sepia(1) hue-rotate(75deg) saturate(4) brightness(0.9); }

  :root[data-look="retro"] body::after {
    content: "";
    position: fixed;
    inset: 0;
    z-index: 5;
    pointer-events: none;
    background: repeating-linear-gradient(0deg, rgba(0, 0, 0, 0.28) 0, rgba(0, 0, 0, 0.28) 1px, transparent 1px, transparent 3px);
  }

  /* The ABCDaGames sign at the top of the page. Tapping it goes back to the home page for all the games. */
  .home-sign {
    display: inline-block;
    position: relative;
    z-index: 1;
    margin-bottom: 14px;
    padding: 8px 14px 9px;
    background: var(--paper, #FFF9EC);
    color: var(--ink, #2B2A33);
    border: 3px solid var(--ink, #2B2A33);
    border-radius: 14px;
    box-shadow: 4px 4px 0 var(--ink, #2B2A33);
    text-decoration: none;
    line-height: 1.15;
    font-family: ui-rounded, "Arial Rounded MT Bold", "Segoe UI Variable Display", "Segoe UI", system-ui, sans-serif;
  }

  .home-sign b { display: block; font-size: 24px; letter-spacing: -0.3px; }
  .home-sign i { display: block; font-style: normal; font-size: 13px; color: var(--muted, #5F5B6B); }

  @keyframes pop {
    0% { transform: scale(1); }
    40% { transform: scale(1.05) rotate(-1deg); }
    70% { transform: scale(0.98) rotate(1deg); }
    100% { transform: scale(1); }
  }

  @keyframes stamp {
    0% { transform: rotate(-6deg) scale(2.2); opacity: 0; }
    100% { transform: rotate(-6deg) scale(1); opacity: 1; }
  }

  @media (prefers-reduced-motion: reduce) {
    .answer.right, .stamp { animation: none; }
  }

  @media (max-height: 640px) {
    .peek.tall { height: 130px; }
  }
</style>
</head>
<body>

<div class="scene" id="scene" aria-hidden="true"></div>

<main class="app">
  <a class="home-sign" href="https://jeremynyc4.github.io/games/"><b>ABCDaGames</b><i>Small games to play in a browser. Tap one to play.</i></a>
  <header class="bar" id="bar">
    <div class="readout" id="readout" aria-hidden="true"></div>
    <button class="sound" id="sound" type="button" aria-pressed="true">Sound On</button>
    <button class="sound look" id="look" type="button" aria-pressed="false">Retro Off</button>
  </header>
  <div class="counts" id="counts" hidden>
    <span id="call-count"></span>
    <span id="score"></span>
  </div>

  <section id="screen-start">
    <div class="peek tall"></div>
    <div class="panel">
      <p class="tag">Now Hiring: Help Desk</p>
      <h1>Help Desk Legends</h1>
      <p>The phone is ringing. Read each call and tap how the story ends.</p>
      <p class="small">These are tall tales that tech workers have passed around for years. Most of them probably never happened.</p>
      <div class="lengths" id="lengths" role="group" aria-label="How many calls"></div>
      <button class="go" id="start" type="button">Start My Shift</button>
    </div>
  </section>

  <section id="screen-play" hidden>
    <div class="pics" aria-hidden="true"><div class="pic"></div><div class="pic"></div></div>
    <div class="panel">
      <p class="tag" id="ticket-tag"></p>
      <p id="story"></p>
      <h2 id="question"></h2>
    </div>
    <div class="pics" aria-hidden="true"><div class="pic"></div><div class="pic"></div></div>
    <div class="panel">
      <div class="answers" id="answers"></div>
      <div class="feedback" id="feedback" hidden>
        <p class="verdict" id="verdict"></p>
        <p id="after"></p>
        <button class="go" id="next" type="button">Next Call</button>
      </div>
    </div>
    <div class="pics" aria-hidden="true"><div class="pic"></div><div class="pic"></div></div>
  </section>

  <section id="screen-end" hidden>
    <div class="peek tall"></div>
    <div class="panel">
      <p class="tag">Shift Over</p>
      <p class="score-big" id="final-score"></p>
      <p id="final-line"></p>
      <p class="rank" id="rank"></p>
      <p id="rank-line"></p>
      <button class="go" id="again" type="button">Play Again</button>
      <button class="go quiet" id="change" type="button">Change the Number of Calls</button>
    </div>
  </section>
</main>

<script id="game-data">
// The game's content: the shift lengths, the pictures, and the calls.
// test-help-desk.js reads this block on its own, so it holds data and the
// small drawing helpers only, and nothing that touches the page.

const cLengths_arr = [
  { count_int: 3, name_str: 'Coffee Break' },
  { count_int: 8, name_str: 'Lunch Rush' },
  { count_int: 15, name_str: 'Full Shift' }
];

const cInk_str = '#2B2A33';
const cSkin_str = '#F3C9A0';
const cPaperWhite_str = '#FFFDF6';

// >>>>> fnStar_str <<<<<
// Draws a five-pointed star around a center point.
function fnStar_str(pX_int, pY_int, pRadius_int, pFill_str) {
  const cPointCount_int = 10;
  const cInnerRatio_flt = 0.45;
  var vPoints_arr = [];
  var vIndex_int;
  var vRadius_flt;
  var vAngle_flt;
  for (vIndex_int = 0; vIndex_int < cPointCount_int; vIndex_int++) {
    vRadius_flt = vIndex_int % 2 === 0 ? pRadius_int : pRadius_int * cInnerRatio_flt;
    vAngle_flt = Math.PI * vIndex_int / (cPointCount_int / 2) - Math.PI / 2;
    vPoints_arr.push((pX_int + vRadius_flt * Math.cos(vAngle_flt)).toFixed(1) + ',' + (pY_int + vRadius_flt * Math.sin(vAngle_flt)).toFixed(1));
  }
  return '<polygon points="' + vPoints_arr.join(' ') + '" fill="' + pFill_str + '"/>';
}

function fnText_str(pX_int, pY_int, pSize_int, pText_str, pFill_str) {
  return '<text x="' + pX_int + '" y="' + pY_int + '" text-anchor="middle" font-family="Arial, sans-serif" font-weight="700" font-size="' + pSize_int +
    '" fill="' + pFill_str + '" stroke="none">' + pText_str + '</text>';
}

function fnBubble_str() {
  return '<polygon points="60,58 46,86 86,64" fill="#FFFFFF"/><ellipse cx="84" cy="38" rx="60" ry="30" fill="#FFFFFF"/>' +
    '<line x1="62" y1="62" x2="82" y2="66" stroke="#FFFFFF" stroke-width="6"/>';
}

function fnCrayon_str(pFill_str) {
  return '<rect x="70" y="14" width="20" height="70" fill="' + pFill_str + '"/><rect x="70" y="34" width="20" height="26" fill="' + cPaperWhite_str + '" stroke-width="2"/>' +
    '<polygon points="70,84 90,84 80,104" fill="' + pFill_str + '"/>';
}

function fnPencil_str() {
  return '<rect x="24" y="50" width="90" height="20" fill="#F2B632"/><polygon points="114,50 140,60 114,70" fill="#F3EBD3"/><rect x="24" y="50" width="14" height="20" fill="#F29E8E"/>';
}

// The start and end screens show one full picture, the ringing phone, drawn
// on a 400 by 700 canvas. The wall color fills the screen above the desk
// line at y = 290 and the desk color fills it below.
//
// Every call has four small pictures instead: one for its right ending
// (right_str) and one for each wrong ending (wrong_arr, in the same order as
// the call's wrong endings). Each is one plain object that only nods at its
// ending, so no picture gives the answer away. A small picture is drawn in a
// box 160 wide and 108 tall, and the page scatters the four around the call.
const cScenes_obj = {
  lobby: {
    wall_str: '#2F8F9D',
    desk_str: '#C98B4B',
    art_str: '<rect x="96" y="64" width="52" height="52" fill="#F2D25C" transform="rotate(-6 122 90)"/>' +
      '<rect x="256" y="72" width="52" height="52" fill="#F29E8E" transform="rotate(8 282 98)"/>' +
      '<rect x="120" y="222" width="160" height="68" rx="12" fill="#D9534F"/>' +
      '<circle cx="200" cy="256" r="22" fill="#F3EBD3"/>' +
      '<circle cx="200" cy="256" r="7" fill="' + cInk_str + '"/>' +
      '<rect x="100" y="190" width="200" height="36" rx="18" fill="#B63D3A"/>' +
      '<path d="M84 150 q-20 22 0 46" fill="none"/><path d="M64 138 q-32 34 0 70" fill="none"/>' +
      '<path d="M316 150 q20 22 0 46" fill="none"/><path d="M336 138 q32 34 0 70" fill="none"/>'
  },
  floppy: {
    wall_str: '#5B8E7D',
    // An overstuffed suitcase, for the disk that will not fit.
    right_str: '<rect x="62" y="12" width="36" height="22" rx="8" fill="none"/><path d="M30 60 q-20 -4 -16 14 q8 8 16 -2" fill="#D9534F"/><path d="M130 60 q22 -6 18 16 q-10 6 -18 -4" fill="#3D6FB6"/>' +
      '<rect x="24" y="30" width="112" height="78" rx="12" fill="#B5651D"/><line x1="24" y1="62" x2="136" y2="62"/><rect x="72" y="54" width="16" height="16" rx="3" fill="#F2B632"/>',
    wrong_arr: [
      '<polygon points="36,50 18,34 44,30 60,46" fill="#B9884A"/><polygon points="124,50 142,34 116,30 100,46" fill="#B9884A"/>' +
        '<rect x="36" y="50" width="88" height="58" fill="#C99A5B"/><rect x="64" y="70" width="32" height="14" fill="#E9D8A6"/>',
      '<circle cx="48" cy="66" r="16" fill="#8CCB7E"/><circle cx="80" cy="72" r="16" fill="#8CCB7E"/><circle cx="112" cy="66" r="16" fill="#8CCB7E"/>' +
        '<path d="M10 60 q70 86 140 0 q-70 40 -140 0 z" fill="#4E9F6B"/>',
      '<rect x="48" y="14" width="26" height="40" rx="6" fill="#E9C27A"/><rect x="86" y="4" width="26" height="50" rx="6" fill="#E9C27A"/>' +
        '<rect x="26" y="44" width="110" height="60" rx="14" fill="#C9CDD4"/><rect x="134" y="60" width="12" height="10" fill="' + cInk_str + '"/>' +
        '<rect x="36" y="104" width="14" height="4" fill="' + cInk_str + '"/><rect x="112" y="104" width="14" height="4" fill="' + cInk_str + '"/>'
    ]
  },
  cup: {
    wall_str: '#E8B04A',
    right_str: '<path d="M104 52 h16 a16 16 0 0 1 0 32 h-16" fill="none"/><rect x="48" y="40" width="58" height="68" rx="8" fill="#E4572E"/>' +
      '<path d="M64 30 q-8 -12 0 -22" fill="none"/><path d="M88 30 q-8 -12 0 -22" fill="none"/>',
    wrong_arr: [
      '<g transform="rotate(-30 80 60)">' + fnPencil_str() + '</g><path d="M96 98 q8 -10 14 0 q6 10 14 0" fill="none"/>',
      '<rect x="20" y="8" width="120" height="14" rx="5" fill="#7A5C46"/><circle cx="80" cy="24" r="7" fill="' + cInk_str + '"/>' +
        '<path d="M80 28 L52 44 L44 104 H116 L108 44 Z" fill="#3D5A80"/><line x1="80" y1="44" x2="80" y2="104"/>',
      '<polygon points="40,108 80,22 120,108" fill="#FFFFFF"/><polygon points="40,108 80,66 120,108" fill="#F3EBD3"/>'
    ]
  },
  anykey: {
    wall_str: '#7A6FB0',
    // A magnifying glass, for the key nobody can find.
    right_str: '<line x1="96" y1="72" x2="132" y2="104" stroke-width="12"/><circle cx="70" cy="48" r="34" fill="#CDEBFA"/><path d="M52 38 q8 -12 22 -12" fill="none" stroke="#FFFFFF"/>',
    wrong_arr: [
      '<rect x="22" y="54" width="50" height="46" rx="18" fill="' + cSkin_str + '"/><rect x="88" y="54" width="50" height="46" rx="18" fill="' + cSkin_str + '"/>' +
        '<line x1="40" y1="40" x2="34" y2="24"/><line x1="80" y1="40" x2="80" y2="22"/><line x1="120" y1="40" x2="126" y2="24"/>',
      '<path d="M56 54 v-18 a24 24 0 0 1 48 0 v18" fill="none" stroke-width="8"/><rect x="40" y="52" width="80" height="56" rx="8" fill="#F2B632"/>' +

// >>>>> fnMyLogger <<<<<
// The browser version of the logger. A web page cannot reach the log
// spreadsheet, so each entry goes to the browser console instead.
function fnMyLogger(pMessage_str, pFunction_str, pValues_str, pLineNumber_int, pIsError_bol) {
  const cLogType_str = pIsError_bol ? 'Error' : 'Log';
  const cEntry_str = [cLogType_str, 'index.html', pFunction_str, pLineNumber_int, String(pMessage_str), pValues_str].join(' | ');
  if (pIsError_bol) {
    console.error(cEntry_str);
  } else {
    console.log(cEntry_str);
  }
}

// >>>>> fnLineNumber_int <<<<<
// The line number an error was raised on, read from its stack trace.
// Apps Script's V8 runtime has no Error.lineNumber (that exists only in
// Firefox), so the stack is the only place the line number is recorded.
// Returns 'N/A' when the stack carries no line number.
function fnLineNumber_int(pError_obj) {
  const cStack_str = String(pError_obj && pError_obj.stack ? pError_obj.stack : '');
  const cMatch_arr = cStack_str.match(/:(\d+)(?::\d+)?\)?\s*$/m);
  const cRadix_int = 10;
  if (cMatch_arr) {
    return parseInt(cMatch_arr[1], cRadix_int);
  }
  return 'N/A';
}

function fnElement_obj(pId_str) {
  return document.getElementById(pId_str);
}

// >>>>> fnShuffle_arr <<<<<
// Returns a shuffled copy of a list and leaves the original alone.
function fnShuffle_arr(pItems_arr) {
  var vCopy_arr = pItems_arr.slice();
  var vIndex_int;
  var vSwap_int;
  var vHold_obj;
  for (vIndex_int = vCopy_arr.length - 1; vIndex_int > 0; vIndex_int--) {
    vSwap_int = Math.floor(Math.random() * (vIndex_int + 1));
    vHold_obj = vCopy_arr[vIndex_int];
    vCopy_arr[vIndex_int] = vCopy_arr[vSwap_int];
    vCopy_arr[vSwap_int] = vHold_obj;
  }
  return vCopy_arr;
}

}

// >>>>> fnShowPictures <<<<<
// Scatters a call's four small pictures around its two cards. Each of the
// three rows gets at least one picture, so they never bunch up at the top,
// and which picture lands where is random, as are its tilt and its nudge to
// one side. The wall color fills the whole screen behind them.
function fnShowPictures(pId_str) {
  var vValues_str = pId_str;
  var vIsError_bol = true;
  var vScene_obj;
  var vArts_arr;
  var vCells_arr;
  var vPlaces_arr = [];
  var vSpare_arr = [];
  var vRow_int;
  var vPick_int;
  var vCell_int;
  try {
    vScene_obj = cScenes_obj[pId_str];
    document.documentElement.style.setProperty('--wall', vScene_obj.wall_str);
    document.documentElement.style.setProperty('--desk', vScene_obj.wall_str);
    fnElement_obj('scene').innerHTML = '';
    vArts_arr = fnShuffle_arr([vScene_obj.right_str].concat(vScene_obj.wrong_arr));
    for (vRow_int = 0; vRow_int < cPicRows_int; vRow_int++) {
      vPick_int = Math.floor(Math.random() * cPicsPerRow_int);
      for (vCell_int = 0; vCell_int < cPicsPerRow_int; vCell_int++) {
        if (vCell_int === vPick_int) {
          vPlaces_arr.push(vRow_int * cPicsPerRow_int + vCell_int);
        } else {
          vSpare_arr.push(vRow_int * cPicsPerRow_int + vCell_int);
        }
      }
    }
    vPlaces_arr = vPlaces_arr.concat(fnShuffle_arr(vSpare_arr).slice(0, vArts_arr.length - vPlaces_arr.length));
    vCells_arr = Array.prototype.slice.call(document.querySelectorAll('.pic'));
    vCells_arr.forEach(function (pCell_obj) {
      pCell_obj.innerHTML = '';
    });
    vArts_arr.forEach(function (pArt_str, pIndex_int) {
      var vCell_obj = vCells_arr[vPlaces_arr[pIndex_int]];
      var vTilt_int = Math.round((Math.random() * 2 - 1) * cMaxTilt_int);
      var vShift_int = Math.round((Math.random() * 2 - 1) * cMaxShift_int);
      vCell_obj.innerHTML = '<svg viewBox="-8 -8 176 124" xmlns="http://www.w3.org/2000/svg">' +
        '<g stroke="' + cInk_str + '" stroke-width="4" stroke-linejoin="round" stroke-linecap="round">' + pArt_str + '</g></svg>';
      vCell_obj.style.transform = 'translateX(' + vShift_int + 'px) rotate(' + vTilt_int + 'deg)';
    });
  } catch (vError_obj) {
    fnMyLogger(vError_obj, 'fnShowPictures', vValues_str, fnLineNumber_int(vError_obj), vIsError_bol);
  }
}

// >>>>> fnStopSounds <<<<<
// Cuts off the ring and the caller's voice, so sounds never pile up.
function fnStopSounds() {
  var vValues_str = '';

}

// >>>>> fnPlayRing <<<<<
// Plays the phone's ring when a new call comes up. The browser makes the
// sound itself from the pitches at the top of this block.
function fnPlayRing() {
  var vValues_str = '';
  var vIsError_bol = true;
  var vAudioClass_fnc;
  var vStart_flt;
  try {
    fnStopSounds();
    vAudioClass_fnc = window.AudioContext || window.webkitAudioContext;
    if (!gIsSoundOn_bol || !vAudioClass_fnc) {
      return;
    }
    if (!gAudio_obj) {
      gAudio_obj = new vAudioClass_fnc();
    }
    if (gAudio_obj.state === 'suspended') {
      gAudio_obj.resume();
    }
    vStart_flt = gAudio_obj.currentTime + 0.05;
    cRingPitches_arr.forEach(function (pPitch_int, pBurst_int) {
      var vTone_obj = gAudio_obj.createOscillator();
      var vVolume_obj = gAudio_obj.createGain();
      var vSoften_obj = gAudio_obj.createBiquadFilter();
      var vBegin_flt = vStart_flt + pBurst_int * cRingBurstGap_flt;
      var vEnd_flt = vBegin_flt + cRingBurstLength_flt;
      var vStep_int = 0;
      var vAt_flt;
      vTone_obj.type = 'square';
      for (vAt_flt = vBegin_flt; vAt_flt < vEnd_flt; vAt_flt += cRingWarbleStep_flt) {
        vTone_obj.frequency.setValueAtTime(vStep_int % 2 === 0 ? pPitch_int : pPitch_int * cRingWarbleRatio_flt, vAt_flt);
        vStep_int++;
      }
      vVolume_obj.gain.setValueAtTime(0, vBegin_flt);
      vVolume_obj.gain.linearRampToValueAtTime(cRingVolume_flt, vBegin_flt + cRingFade_flt);
      vVolume_obj.gain.setValueAtTime(cRingVolume_flt, vEnd_flt - cRingFade_flt);
      vVolume_obj.gain.linearRampToValueAtTime(0, vEnd_flt);
      vSoften_obj.type = 'lowpass';
      vSoften_obj.frequency.value = cRingSoftenHz_int;
      vTone_obj.connect(vSoften_obj);
      vSoften_obj.connect(vVolume_obj);
      vVolume_obj.connect(gAudio_obj.destination);
      vTone_obj.start(vBegin_flt);
      vTone_obj.stop(vEnd_flt);
      gRing_arr.push(vTone_obj);
    });
  } catch (vError_obj) {
    fnMyLogger(vError_obj, 'fnPlayRing', vValues_str, fnLineNumber_int(vError_obj), vIsError_bol);
  }
}

// >>>>> fnPlayVoice <<<<<
// Plays the caller's reply after an answer: thanks for a right one, and a
// puzzled line for a wrong one. A browser that refuses to play it is only
// noted in the console, because the game works the same without sound.
function fnPlayVoice(pIsRight_bol) {
  var vValues_str = String(pIsRight_bol);
  var vIsError_bol = true;
  try {
    fnStopSounds();
    if (!gIsSoundOn_bol) {
      return;
    }
    gVoice_obj = new Audio(pIsRight_bol ? cThanksVoice_str : cStillVoice_str);
    gVoice_obj.playbackRate = cVoiceSpeed_flt;
    gVoice_obj.play().catch(function (pReason_obj) {
      fnMyLogger(pReason_obj, 'fnPlayVoice', vValues_str, 'N/A', false);
    });
  } catch (vError_obj) {
    fnMyLogger(vError_obj, 'fnPlayVoice', vValues_str, fnLineNumber_int(vError_obj), vIsError_bol);
  }
}

// >>>>> fnSettleReadout <<<<<
// Brings the score card up to date, unless the readout is in the middle of

    fnMyLogger(vError_obj, 'fnSettleReadout', vValues_str, fnLineNumber_int(vError_obj), vIsError_bol);

// >>>>> fnRestReadout <<<<<
// Stops any flashing and leaves the readout at rest as a score card: the
// number of calls solved so far, during a game and on the end screen, and
// two dashes on the start screen.
function fnRestReadout() {
  var vValues_str = '';
  var vIsError_bol = true;
  try {
    (gReadoutTimers_arr || []).forEach(function (pTimer_int) {
      clearTimeout(pTimer_int);
      clearInterval(pTimer_int);
    });
    gReadoutTimers_arr = [];
    if (gScreen_str === 'play' || gScreen_str === 'end') {
      fnShowReadout((gScore_int < cReadoutTens_int ? '0' : '') + gScore_int);
    } else {
      fnShowReadout(cReadoutIdle_str);
    }
  } catch (vError_obj) {
    fnMyLogger(vError_obj, 'fnRestReadout', vValues_str, fnLineNumber_int(vError_obj), vIsError_bol);
  }
}

// >>>>> fnPlayBeep <<<<<
// Plays one plain sine-wave beep, if the sound is on.
function fnPlayBeep() {
  var vValues_str = '';
  var vIsError_bol = true;
  var vAudioClass_fnc;
  var vTone_obj;
  var vVolume_obj;
  var vBegin_flt;
  try {
    vAudioClass_fnc = window.AudioContext || window.webkitAudioContext;
    if (!gIsSoundOn_bol || !vAudioClass_fnc) {
      return;
    }
    if (!gAudio_obj) {
      gAudio_obj = new vAudioClass_fnc();
    }
    if (gAudio_obj.state === 'suspended') {
      gAudio_obj.resume();
    }
    vBegin_flt = gAudio_obj.currentTime;
    vTone_obj = gAudio_obj.createOscillator();
    vVolume_obj = gAudio_obj.createGain();
    vTone_obj.type = 'sine';
    vTone_obj.frequency.value = cBeepHz_int;
    vVolume_obj.gain.setValueAtTime(0, vBegin_flt);
    vVolume_obj.gain.linearRampToValueAtTime(cBeepVolume_flt, vBegin_flt + cRingFade_flt);
    vVolume_obj.gain.setValueAtTime(cBeepVolume_flt, vBegin_flt + cBeepSeconds_flt - cRingFade_flt);
    vVolume_obj.gain.linearRampToValueAtTime(0, vBegin_flt + cBeepSeconds_flt);
    vTone_obj.connect(vVolume_obj);
    vVolume_obj.connect(gAudio_obj.destination);
    vTone_obj.start(vBegin_flt);
    vTone_obj.stop(vBegin_flt + cBeepSeconds_flt);
    gRing_arr.push(vTone_obj);
  } catch (vError_obj) {
    fnMyLogger(vError_obj, 'fnPlayBeep', vValues_str, fnLineNumber_int(vError_obj), vIsError_bol);
  }
}

// >>>>> fnRunReadout <<<<<
// Runs the readout's opening flash when the retro look comes on: random
// numbers flash by, then the readout spells out a beep in two halves while
// the beep sounds, and then it settles down as the score card.
function fnRunReadout() {
  var vValues_str = '';
  var vIsError_bol = true;
  var vFlash_int;
  try {
    fnRestReadout();
    if (!gIsRetro_bol) {
      return;
    }
    vFlash_int = setInterval(function () {
      fnShowReadout(String(Math.floor(Math.random() * 10)) + String(Math.floor(Math.random() * 10)));
    }, cFlashStepMs_int);
    gReadoutTimers_arr.push(vFlash_int);
    gReadoutTimers_arr.push(setTimeout(function () {
      clearInterval(vFlash_int);
      fnShowReadout(cReadoutFirst_str);
      fnPlayBeep();
    }, cFlashMs_int));
    gReadoutTimers_arr.push(setTimeout(function () {
      fnShowReadout(cReadoutSecond_str);
    }, cFlashMs_int + cFirstShowMs_int));
    gReadoutTimers_arr.push(setTimeout(fnRestReadout, cFlashMs_int + cFirstShowMs_int + cSecondShowMs_int));
  } catch (vError_obj) {
    fnMyLogger(vError_obj, 'fnRunReadout', vValues_str, fnLineNumber_int(vError_obj), vIsError_bol);
  }
}

// >>>>> fnShowQuestion <<<<<
// Shows the current call: its pictures, its story, and its four endings in a
// fresh order. Exactly one of the four buttons carries the right ending.
function fnShowQuestion() {
  var vValues_str = String(gIndex_int);
  var vIsError_bol = true;
  var vQuestion_obj;
  var vOptions_arr;
  var vHolder_obj;
  try {
    vQuestion_obj = gDeck_arr[gIndex_int];
    vOptions_arr = fnShuffle_arr([{ text_str: vQuestion_obj.right_str, isRight_bol: true }].concat(
      vQuestion_obj.wrong_arr.map(function (pText_str) {
        return { text_str: pText_str, isRight_bol: false };
      })
    ));
    fnShowPictures(vQuestion_obj.id_str);

    fnElement_obj('story').textContent = vQuestion_obj.story_str;
    fnElement_obj('question').textContent = vQuestion_obj.question_str;
    fnElement_obj('feedback').hidden = true;
    vHolder_obj = fnElement_obj('answers');
    vHolder_obj.innerHTML = '';
    vOptions_arr.forEach(function (pOption_obj, pPosition_int) {
      var vButton_obj = document.createElement('button');
      var vLetter_obj = document.createElement('span');
      var vText_obj = document.createElement('span');
      vButton_obj.type = 'button';
      vButton_obj.className = 'answer';
      vButton_obj.dataset.right = String(pOption_obj.isRight_bol);
      vLetter_obj.className = 'letter';
      vLetter_obj.textContent = cLetters_arr[pPosition_int];
      vText_obj.textContent = pOption_obj.text_str;
      vButton_obj.appendChild(vLetter_obj);
      vButton_obj.appendChild(vText_obj);
      vButton_obj.addEventListener('click', function () {
        fnChoose(vButton_obj);
      });
      vHolder_obj.appendChild(vButton_obj);
    });
    window.scrollTo(0, 0);
    fnPlayRing();
  } catch (vError_obj) {
    fnMyLogger(vError_obj, 'fnShowQuestion', vValues_str, fnLineNumber_int(vError_obj), vIsError_bol);
  }
}

// >>>>> fnChoose <<<<<
// Handles a tap on an ending. Each call gets one tap: the right ending
// lights up either way, and a miss gets a gentle note, never a scolding.
function fnChoose(pButton_obj) {
  var vValues_str = '';
  var vIsError_bol = true;
  var vIsRight_bol;
  var vIsLast_bol;
  var vVerdict_obj;
  var vStamp_obj;
  var vAfter_str;
  try {
    vIsRight_bol = pButton_obj.dataset.right === 'true';
    vIsLast_bol = gIndex_int === gDeck_arr.length - 1;
    fnPlayVoice(vIsRight_bol);
    Array.prototype.forEach.call(fnElement_obj('answers').children, function (pEach_obj) {
      pEach_obj.disabled = true;
      if (pEach_obj.dataset.right === 'true') {
        pEach_obj.classList.add('right');
      }
    });
    vVerdict_obj = fnElement_obj('verdict');
    vVerdict_obj.textContent = '';
    if (vIsRight_bol) {
      gScore_int++;
      vStamp_obj = document.createElement('span');
      vStamp_obj.className = 'stamp';
      vStamp_obj.textContent = 'TICKET CLOSED';
      vVerdict_obj.appendChild(vStamp_obj);
      vVerdict_obj.appendChild(document.createTextNode('You got it!'));
    } else {
      pButton_obj.classList.add('picked-wrong');
      vVerdict_obj.textContent = 'We’ll have to escalate this ticket!';
    }
    // After a miss, the call's closing line follows a few kind words, so it
    // starts with a small letter there.
    vAfter_str = gDeck_arr[gIndex_int].after_str;
    fnElement_obj('after').textContent = vIsRight_bol ? vAfter_str :
      'Don’t worry—that’s why we have second-level support agents. And we get it, ' + vAfter_str.charAt(0).toLowerCase() + vAfter_str.slice(1);
    fnElement_obj('next').textContent = vIsLast_bol ? 'See My Score' : 'Next Call';
    fnElement_obj('feedback').hidden = false;
    fnShowBar();
    fnElement_obj('next').scrollIntoView({ block: 'nearest', behavior: 'smooth' });
  } catch (vError_obj) {
    fnMyLogger(vError_obj, 'fnChoose', vValues_str, fnLineNumber_int(vError_obj), vIsError_bol);
  }
}

// >>>>> fnNext <<<<<

function fnNext() {
  var vValues_str = String(gIndex_int);
  var vIsError_bol = true;
  try {
    if (gIndex_int < gDeck_arr.length - 1) {
      gIndex_int++;
      fnShowQuestion();
    } else {
      fnShowEnd();
    }
  } catch (vError_obj) {
    fnMyLogger(vError_obj, 'fnNext', vValues_str, fnLineNumber_int(vError_obj), vIsError_bol);
  }
}

// >>>>> fnShowEnd <<<<<
// Shows the total and the job title the player earned.
function fnShowEnd() {
  var vValues_str = String(gScore_int);
  var vIsError_bol = true;
  var vRank_str;
  var vRankLine_str;
  try {
    if (gScore_int === gDeck_arr.length) {
      vRank_str = 'Help Desk Legend';
      vRankLine_str = 'A perfect shift. Nothing a caller says can surprise you.';
    } else if (gScore_int >= gDeck_arr.length * cSeniorShare_flt) {
      vRank_str = 'Senior Tech';
      vRankLine_str = 'You have clearly answered a few strange calls before.';
    } else {
      vRank_str = 'Trainee';
      vRankLine_str = 'Have you tried turning it off and on again?';
    }
    fnElement_obj('final-score').textContent = gScore_int + ' of ' + gDeck_arr.length;
    fnElement_obj('final-line').textContent = 'calls solved on the first try.';
    fnElement_obj('rank').textContent = vRank_str;
    fnElement_obj('rank-line').textContent = vRankLine_str;
    fnShowScene(cLobbyScene_str);
    fnShowScreen('end');
  } catch (vError_obj) {
    fnMyLogger(vError_obj, 'fnShowEnd', vValues_str, fnLineNumber_int(vError_obj), vIsError_bol);
  }
}

// Shows the start screen over the ringing phone.

  var vIsError_bol = true;
  try {
    fnBuildLengths();
    fnShowScene(cLobbyScene_str);
    fnShowScreen('start');
  } catch (vError_obj) {

}
