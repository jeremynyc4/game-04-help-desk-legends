<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Help Desk Legends</title>
<style>
  /* Layout: a full-screen picture sits behind one narrow column. The start, play, and end screens swap in place inside that column. */
  :root {
    color-scheme: light;
    --ink: #2B2A33;
    --paper: #FFF9EC;
    --paper-soft: #F3EBD3;
    --muted: #5F5B6B;
    --teal: #2F8F9D;
    --teal-deep: #1F6A75;
    --good: #BFE8B4;
    --good-deep: #2E7D32;
    --miss: #FBE3A8;
    --stamp: #C0392B;
    --wall: #2F8F9D;
    --desk: #C98B4B;
    /* The picture is 400 by 700. It fills the height of a wide screen and the width of a narrow one, and the desk line sits 290 / 700 of the way down it. */
    --scene-height: min(100vh, 175vw);
    --desk-line: calc(var(--scene-height) * 0.4143);
    --font-display: ui-rounded, "Arial Rounded MT Bold", "Segoe UI Variable Display", "Segoe UI", system-ui, sans-serif;
    --font-body: ui-rounded, "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
    --font-mono: ui-monospace, "Cascadia Mono", Consolas, Menlo, monospace;
  }

  *, *::before, *::after { box-sizing: border-box; }
  [hidden] { display: none !important; }

  html { background: var(--desk); }

  body {
    margin: 0;
    color: var(--ink);
    font-family: var(--font-body);
    font-size: 17px;
    line-height: 1.4;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }

  /* The picture behind the game. The wall and desk colors fill the whole screen, and the drawing sits centered on top of them. It never takes taps. */
  .scene {
    position: fixed;
    inset: 0;
    z-index: 0;
    pointer-events: none;
    overflow: hidden;
    background: linear-gradient(var(--wall) 0, var(--wall) var(--desk-line), var(--desk) var(--desk-line), var(--desk) 100%);
  }

  .scene svg {
    position: absolute;
    top: 0;
    left: 50%;
    height: var(--scene-height);
    aspect-ratio: 400 / 700;
    transform: translateX(-50%);
    display: block;
  }

  .app {
    position: relative;
    z-index: 1;
    max-width: 480px;
    margin: 0 auto;
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    padding-block: 12px 28px;
  }

  .bar {
    display: flex;
    justify-content: space-between;
    gap: 8px;
    font-family: var(--font-mono);
    font-size: 14px;
    font-weight: 700;
  }

  .bar span {
    background: var(--ink);
    color: var(--paper);
    padding: 6px 12px;
    border-radius: 999px;
  }

  /* The gap that lets the picture show above the card. */
  .peek { flex: 0 0 auto; height: max(110px, calc(var(--desk-line) - 50px)); }
  .peek.tall { height: max(130px, calc(var(--desk-line) - 16px)); }

  .panel {
    background: rgba(255, 249, 236, 0.95);
    border: 3px solid var(--ink);
    border-radius: 16px;
    box-shadow: 6px 6px 0 var(--ink);
    padding: 18px 18px 20px;
  }

  h1 {
    font-family: var(--font-display);
    font-size: 34px;
    line-height: 1.05;
    margin: 0 0 8px;
    letter-spacing: -0.5px;
  }

  h2 {
    font-family: var(--font-display);
    font-size: 20px;
    line-height: 1.2;
    margin: 10px 0 12px;
  }

  p { margin: 0 0 10px; }
  .small { font-size: 14px; color: var(--muted); }

  .tag {
    font-family: var(--font-mono);
    font-size: 12.5px;
    font-weight: 700;
    letter-spacing: 0.4px;
    text-transform: uppercase;
    color: var(--teal-deep);
    margin: 0 0 6px;
  }

  .lengths { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 14px 0 16px; }

  button {
    font: inherit;
    color: var(--ink);
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
  }

  .length {
    min-height: 72px;
    background: var(--paper);
    border: 3px solid var(--ink);
    border-radius: 12px;
    padding: 8px 4px;
    line-height: 1.15;
  }

  .length b { display: block; font-family: var(--font-display); font-size: 26px; }
  .length span { font-size: 13px; }
  .length[aria-pressed="true"] { background: var(--ink); color: var(--paper); }

  .go {
    display: block;
    width: 100%;
    min-height: 56px;
    background: var(--teal);
    color: #FFFFFF;
    font-family: var(--font-display);
    font-size: 20px;
    font-weight: 700;
    border: 3px solid var(--ink);
    border-radius: 12px;
    box-shadow: 4px 4px 0 var(--ink);
  }

  .go:active { transform: translate(2px, 2px); box-shadow: 2px 2px 0 var(--ink); }
  .go.quiet { background: var(--paper); color: var(--ink); margin-top: 12px; box-shadow: none; }

  .answers { display: grid; gap: 10px; }

  .answer {
    display: flex;
    align-items: center;
    gap: 12px;
    width: 100%;
    min-height: 54px;
    text-align: left;
    background: var(--paper);
    border: 3px solid var(--ink);
    border-radius: 12px;
    padding: 8px 12px;
    line-height: 1.25;
  }

  .answer .letter {
    flex: 0 0 30px;
    height: 30px;
    display: grid;
    place-items: center;
    background: var(--ink);
    color: var(--paper);
    border-radius: 50%;
    font-family: var(--font-mono);
    font-weight: 700;
    font-size: 15px;
  }

  .answer:disabled { cursor: default; color: var(--ink); opacity: 0.55; }
  .answer.right { background: var(--good); opacity: 1; animation: pop 0.45s ease-out; }
  .answer.right .letter { background: var(--good-deep); }
  .answer.picked-wrong { background: var(--miss); opacity: 1; }

  .feedback { margin-top: 14px; }

  .verdict {
    font-family: var(--font-display);
    font-weight: 700;
    font-size: 19px;
    margin-bottom: 4px;
  }

  .stamp {
    display: inline-block;
    font-family: var(--font-mono);
    font-weight: 700;
    font-size: 15px;
    letter-spacing: 1px;
    color: var(--stamp);
    border: 3px solid var(--stamp);
    border-radius: 6px;
    padding: 2px 8px;
    margin-right: 8px;
    transform: rotate(-6deg);
    animation: stamp 0.4s ease-out;
  }

  .score-big { font-family: var(--font-display); font-size: 56px; font-weight: 700; line-height: 1; margin: 6px 0 2px; }
  .rank { font-family: var(--font-display); font-size: 24px; font-weight: 700; color: var(--teal-deep); margin-bottom: 6px; }

  @keyframes pop {
    0% { transform: scale(1); }
    40% { transform: scale(1.05) rotate(-1deg); }
    70% { transform: scale(0.98) rotate(1deg); }
    100% { transform: scale(1); }
  }

  @keyframes stamp {
    0% { transform: rotate(-6deg) scale(2.2); opacity: 0; }
    100% { transform: rotate(-6deg) scale(1); opacity: 1; }
  }

  @media (prefers-reduced-motion: reduce) {
    .answer.right, .stamp { animation: none; }
  }

  @media (max-height: 640px) {
    .peek { height: 110px; }
    .peek.tall { height: 130px; }
  }
</style>
</head>
<body>

<div class="scene" id="scene" aria-hidden="true"></div>

<main class="app">
  <header class="bar" id="bar" hidden>
    <span id="call-count"></span>
    <span id="score"></span>
  </header>

  <section id="screen-start">
    <div class="peek tall"></div>
    <div class="panel">
      <p class="tag">Now Hiring: Help Desk</p>
      <h1>Help Desk Legends</h1>
      <p>The phone is ringing. Read each call and tap how the story ends. The picture behind each call is a hint.</p>
      <p class="small">These are tall tales that tech workers have passed around for years. Most of them probably never happened.</p>
      <div class="lengths" id="lengths" role="group" aria-label="How many calls"></div>
      <button class="go" id="start" type="button">Start My Shift</button>
    </div>
  </section>

  <section id="screen-play" hidden>
    <div class="peek"></div>
    <div class="panel">
      <p class="tag" id="ticket-tag"></p>
      <p id="story"></p>
      <h2 id="question"></h2>
      <div class="answers" id="answers"></div>
      <div class="feedback" id="feedback" hidden>
        <p class="verdict" id="verdict"></p>
        <p id="after"></p>
        <button class="go" id="next" type="button">Next Call</button>
      </div>
    </div>
  </section>

  <section id="screen-end" hidden>
    <div class="peek tall"></div>
    <div class="panel">
      <p class="tag">Shift Over</p>
      <p class="score-big" id="final-score"></p>
      <p id="final-line"></p>
      <p class="rank" id="rank"></p>
      <p id="rank-line"></p>
      <button class="go" id="again" type="button">Play Again</button>
      <button class="go quiet" id="change" type="button">Change the Number of Calls</button>
    </div>
  </section>
</main>

// >>>>> fnMonitor_str <<<<<
// Draws a boxy old monitor that stands on the desk line. The caller passes
// the bezel color, the screen color, and whatever is drawn on the screen.
function fnMonitor_str(pBezel_str, pScreen_str, pInner_str) {
  return '<rect x="170" y="250" width="60" height="22" fill="' + cBeigeDark_str + '"/>' +
    '<rect x="140" y="270" width="120" height="20" rx="6" fill="' + pBezel_str + '"/>' +
    '<rect x="80" y="70" width="240" height="180" rx="14" fill="' + pBezel_str + '"/>' +
    '<rect x="100" y="88" width="200" height="130" rx="6" fill="' + pScreen_str + '"/>' +
    pInner_str +
    '<circle cx="290" cy="234" r="5" fill="#7BC67B"/>';
}

// >>>>> fnStar_str <<<<<
// Draws a five-pointed star around a center point.
function fnStar_str(pX_int, pY_int, pRadius_int, pFill_str) {
  const cPointCount_int = 10;
  const cInnerRatio_flt = 0.45;
  var vPoints_arr = [];
  var vIndex_int;
  var vRadius_flt;
  var vAngle_flt;
  for (vIndex_int = 0; vIndex_int < cPointCount_int; vIndex_int++) {
    vRadius_flt = vIndex_int % 2 === 0 ? pRadius_int : pRadius_int * cInnerRatio_flt;
    vAngle_flt = Math.PI * vIndex_int / (cPointCount_int / 2) - Math.PI / 2;
    vPoints_arr.push((pX_int + vRadius_flt * Math.cos(vAngle_flt)).toFixed(1) + ',' + (pY_int + vRadius_flt * Math.sin(vAngle_flt)).toFixed(1));
  }
  return '<polygon points="' + vPoints_arr.join(' ') + '" fill="' + pFill_str + '"/>';
}

// >>>>> fnKeys_str <<<<<
// Draws one row of keyboard keys. The key at pGap_int is left out and
// drawn as an empty outline with a question mark, for the missing "Any" key.
function fnKeys_str(pY_int, pGap_int) {
  const cKeyCount_int = 7;
  const cFirstX_int = 76;
  const cStep_int = 36;
  const cSize_int = 28;
  var vKeys_str = '';
  var vIndex_int;
  var vX_int;
  for (vIndex_int = 0; vIndex_int < cKeyCount_int; vIndex_int++) {
    vX_int = cFirstX_int + vIndex_int * cStep_int;
    if (vIndex_int === pGap_int) {
      vKeys_str += '<rect x="' + vX_int + '" y="' + pY_int + '" width="' + cSize_int + '" height="' + cSize_int + '" rx="5" fill="#F2B632"/>' +
        '<text x="' + (vX_int + cSize_int / 2) + '" y="' + (pY_int + 22) + '" text-anchor="middle" font-family="Arial, sans-serif" font-weight="700" font-size="22" fill="' + cInk_str + '" stroke="none">?</text>';
    } else {
      vKeys_str += '<rect x="' + vX_int + '" y="' + pY_int + '" width="' + cSize_int + '" height="' + cSize_int + '" rx="5" fill="#FFFDF6"/>';
    }
  }
  return vKeys_str;
}

<script>
// The game itself: it deals a shift of calls, shows one call at a time over
// its picture, checks the tap, and keeps score.

const cLobbyScene_str = 'lobby';
const cDefaultLengthIndex_int = 1;
const cFirstTicketNumber_int = 1042;
const cLetters_arr = ['A', 'B', 'C', 'D'];
const cSeniorShare_flt = 0.6;

var gLength_int;
var gDeck_arr;
var gIndex_int;
var gScore_int;

// >>>>> fnMyLogger <<<<<
// The browser version of the logger. A web page cannot reach the log
// spreadsheet, so each entry goes to the browser console instead.
function fnMyLogger(pMessage_str, pFunction_str, pValues_str, pLineNumber_int, pIsError_bol) {
  const cLogType_str = pIsError_bol ? 'Error' : 'Log';
  const cEntry_str = [cLogType_str, 'index.html', pFunction_str, pLineNumber_int, String(pMessage_str), pValues_str].join(' | ');
  if (pIsError_bol) {
    console.error(cEntry_str);
  } else {
    console.log(cEntry_str);
  }
}

// >>>>> fnLineNumber_int <<<<<
// The line number an error was raised on, read from its stack trace.
// Apps Script's V8 runtime has no Error.lineNumber (that exists only in
// Firefox), so the stack is the only place the line number is recorded.
// Returns 'N/A' when the stack carries no line number.
function fnLineNumber_int(pError_obj) {
  const cStack_str = String(pError_obj && pError_obj.stack ? pError_obj.stack : '');
  const cMatch_arr = cStack_str.match(/:(\d+)(?::\d+)?\)?\s*$/m);
  const cRadix_int = 10;
  if (cMatch_arr) {
    return parseInt(cMatch_arr[1], cRadix_int);
  }
  return 'N/A';
}

function fnElement_obj(pId_str) {
  return document.getElementById(pId_str);
}

// >>>>> fnShuffle_arr <<<<<
// Returns a shuffled copy of a list and leaves the original alone.
function fnShuffle_arr(pItems_arr) {
  var vCopy_arr = pItems_arr.slice();
  var vIndex_int;
  var vSwap_int;
  var vHold_obj;
  for (vIndex_int = vCopy_arr.length - 1; vIndex_int > 0; vIndex_int--) {
    vSwap_int = Math.floor(Math.random() * (vIndex_int + 1));
    vHold_obj = vCopy_arr[vIndex_int];
    vCopy_arr[vIndex_int] = vCopy_arr[vSwap_int];
    vCopy_arr[vSwap_int] = vHold_obj;
  }
  return vCopy_arr;
}

// >>>>> fnShowScene <<<<<
// Paints the picture for one call behind the game, along with its wall and
// desk colors.
function fnShowScene(pId_str) {
  var vValues_str = pId_str;
  var vIsError_bol = true;
  var vScene_obj;
  var vRoot_obj;
  try {
    vScene_obj = cScenes_obj[pId_str];
    vRoot_obj = document.documentElement;
    vRoot_obj.style.setProperty('--wall', vScene_obj.wall_str);
    vRoot_obj.style.setProperty('--desk', vScene_obj.desk_str);
    fnElement_obj('scene').innerHTML = '<svg viewBox="0 0 400 700" xmlns="http://www.w3.org/2000/svg">' +
      '<g stroke="' + cInk_str + '" stroke-width="4" stroke-linejoin="round" stroke-linecap="round">' + vScene_obj.art_str + '</g></svg>';
  } catch (vError_obj) {
    fnMyLogger(vError_obj, 'fnShowScene', vValues_str, fnLineNumber_int(vError_obj), vIsError_bol);
  }
}

// >>>>> fnShowScreen <<<<<
// Shows one of the three screens (start, play, or end) and hides the others.
function fnShowScreen(pName_str) {
  var vValues_str = pName_str;
  var vIsError_bol = true;
  try {
    ['start', 'play', 'end'].forEach(function (pEach_str) {
      fnElement_obj('screen-' + pEach_str).hidden = pEach_str !== pName_str;
    });
    fnElement_obj('bar').hidden = pName_str !== 'play';
    window.scrollTo(0, 0);
  } catch (vError_obj) {
    fnMyLogger(vError_obj, 'fnShowScreen', vValues_str, fnLineNumber_int(vError_obj), vIsError_bol);
  }
}

// >>>>> fnBuildLengths <<<<<
// Draws the three shift-length buttons on the start screen.
function fnBuildLengths() {
  var vValues_str = '';
  var vIsError_bol = true;
  var vHolder_obj;
  try {
    vHolder_obj = fnElement_obj('lengths');
    vHolder_obj.innerHTML = '';
    cLengths_arr.forEach(function (pLength_obj) {
      var vButton_obj = document.createElement('button');
      vButton_obj.type = 'button';
      vButton_obj.className = 'length';
      vButton_obj.innerHTML = '<b>' + pLength_obj.count_int + '</b><span>' + pLength_obj.name_str + '</span>';
      vButton_obj.setAttribute('aria-label', pLength_obj.count_int + ' calls, ' + pLength_obj.name_str);
      vButton_obj.setAttribute('aria-pressed', String(pLength_obj.count_int === gLength_int));
      vButton_obj.addEventListener('click', function () {
        gLength_int = pLength_obj.count_int;
        fnBuildLengths();
      });
      vHolder_obj.appendChild(vButton_obj);
    });
  } catch (vError_obj) {
    fnMyLogger(vError_obj, 'fnBuildLengths', vValues_str, fnLineNumber_int(vError_obj), vIsError_bol);
  }
}

// >>>>> fnShowBar <<<<<
// Keeps the call count and the score in view at the top of the play screen.
function fnShowBar() {
  var vValues_str = '';
  var vIsError_bol = true;
  try {
    fnElement_obj('call-count').textContent = 'Call ' + (gIndex_int + 1) + ' of ' + gDeck_arr.length;
    fnElement_obj('score').textContent = 'Solved: ' + gScore_int;
  } catch (vError_obj) {
    fnMyLogger(vError_obj, 'fnShowBar', vValues_str, fnLineNumber_int(vError_obj), vIsError_bol);
  }
}

// >>>>> fnShowQuestion <<<<<
// Shows the current call: its picture, its story, and its four endings in a
// fresh order. Exactly one of the four buttons carries the right ending.
function fnShowQuestion() {
  var vValues_str = String(gIndex_int);
  var vIsError_bol = true;
  var vQuestion_obj;
  var vOptions_arr;
  var vHolder_obj;
  try {
    vQuestion_obj = gDeck_arr[gIndex_int];
    vOptions_arr = fnShuffle_arr([{ text_str: vQuestion_obj.right_str, isRight_bol: true }].concat(
      vQuestion_obj.wrong_arr.map(function (pText_str) {
        return { text_str: pText_str, isRight_bol: false };
      })
    ));
    fnShowScene(vQuestion_obj.id_str);
    fnShowBar();
    fnElement_obj('ticket-tag').textContent = 'Ticket #' + (cFirstTicketNumber_int + gIndex_int) + ' · ' + vQuestion_obj.subject_str;
    fnElement_obj('story').textContent = vQuestion_obj.story_str;
    fnElement_obj('question').textContent = vQuestion_obj.question_str;
    fnElement_obj('feedback').hidden = true;
    vHolder_obj = fnElement_obj('answers');
    vHolder_obj.innerHTML = '';
    vOptions_arr.forEach(function (pOption_obj, pPosition_int) {
      var vButton_obj = document.createElement('button');
      var vLetter_obj = document.createElement('span');
      var vText_obj = document.createElement('span');
      vButton_obj.type = 'button';
      vButton_obj.className = 'answer';
      vButton_obj.dataset.right = String(pOption_obj.isRight_bol);
      vLetter_obj.className = 'letter';
      vLetter_obj.textContent = cLetters_arr[pPosition_int];
      vText_obj.textContent = pOption_obj.text_str;
      vButton_obj.appendChild(vLetter_obj);
      vButton_obj.appendChild(vText_obj);
      vButton_obj.addEventListener('click', function () {
        fnChoose(vButton_obj);
      });
      vHolder_obj.appendChild(vButton_obj);
    });
    window.scrollTo(0, 0);
  } catch (vError_obj) {
    fnMyLogger(vError_obj, 'fnShowQuestion', vValues_str, fnLineNumber_int(vError_obj), vIsError_bol);
  }
}

// >>>>> fnChoose <<<<<
// Handles a tap on an ending. Each call gets one tap: the right ending
// lights up either way, and a miss gets a gentle note, never a scolding.
function fnChoose(pButton_obj) {
  var vValues_str = '';
  var vIsError_bol = true;
  var vIsRight_bol;
  var vIsLast_bol;
  var vVerdict_obj;
  var vStamp_obj;
  try {
    vIsRight_bol = pButton_obj.dataset.right === 'true';
    vIsLast_bol = gIndex_int === gDeck_arr.length - 1;
    Array.prototype.forEach.call(fnElement_obj('answers').children, function (pEach_obj) {
      pEach_obj.disabled = true;
      if (pEach_obj.dataset.right === 'true') {
        pEach_obj.classList.add('right');
      }
    });
    vVerdict_obj = fnElement_obj('verdict');
    vVerdict_obj.textContent = '';
    if (vIsRight_bol) {
      gScore_int++;
      vStamp_obj = document.createElement('span');
      vStamp_obj.className = 'stamp';
      vStamp_obj.textContent = 'TICKET CLOSED';
      vVerdict_obj.appendChild(vStamp_obj);
      vVerdict_obj.appendChild(document.createTextNode('You got it!'));
    } else {
      pButton_obj.classList.add('picked-wrong');
      vVerdict_obj.textContent = 'Good guess! The legend goes the other way.';
    }
    fnElement_obj('after').textContent = gDeck_arr[gIndex_int].after_str;
    fnElement_obj('next').textContent = vIsLast_bol ? 'See My Score' : 'Next Call';
    fnElement_obj('feedback').hidden = false;
    fnShowBar();
    fnElement_obj('next').scrollIntoView({ block: 'nearest', behavior: 'smooth' });
  } catch (vError_obj) {
    fnMyLogger(vError_obj, 'fnChoose', vValues_str, fnLineNumber_int(vError_obj), vIsError_bol);
  }
}

// >>>>> fnNext <<<<<
// Moves on to the next call, or to the end screen after the last one.
function fnNext() {
  var vValues_str = String(gIndex_int);
  var vIsError_bol = true;
  try {
    if (gIndex_int < gDeck_arr.length - 1) {
      gIndex_int++;
      fnShowQuestion();
    } else {
      fnShowEnd();
    }
  } catch (vError_obj) {
    fnMyLogger(vError_obj, 'fnNext', vValues_str, fnLineNumber_int(vError_obj), vIsError_bol);
  }
}

// >>>>> fnShowEnd <<<<<
// Shows the total and the job title the player earned.
function fnShowEnd() {
  var vValues_str = String(gScore_int);
  var vIsError_bol = true;
  var vRank_str;
  var vRankLine_str;
  try {
    if (gScore_int === gDeck_arr.length) {
      vRank_str = 'Help Desk Legend';
      vRankLine_str = 'A perfect shift. Nothing a caller says can surprise you.';
    } else if (gScore_int >= gDeck_arr.length * cSeniorShare_flt) {
      vRank_str = 'Senior Tech';
      vRankLine_str = 'You have clearly answered a few strange calls before.';
    } else {
      vRank_str = 'Trainee';
      vRankLine_str = 'Have you tried turning it off and on again?';
    }
    fnElement_obj('final-score').textContent = gScore_int + ' of ' + gDeck_arr.length;
    fnElement_obj('final-line').textContent = 'calls solved on the first try.';
    fnElement_obj('rank').textContent = vRank_str;
    fnElement_obj('rank-line').textContent = vRankLine_str;
    fnShowScene(cLobbyScene_str);
    fnShowScreen('end');
  } catch (vError_obj) {
    fnMyLogger(vError_obj, 'fnShowEnd', vValues_str, fnLineNumber_int(vError_obj), vIsError_bol);
  }
}

// >>>>> fnDealGame <<<<<
// Deals a fresh shift: a new random set of calls, in a new order.
function fnDealGame() {
  var vValues_str = String(gLength_int);
  var vIsError_bol = true;
  try {
    gDeck_arr = fnShuffle_arr(cQuestions_arr).slice(0, gLength_int);
    gIndex_int = 0;
    gScore_int = 0;
    fnShowScreen('play');
    fnShowQuestion();
  } catch (vError_obj) {
    fnMyLogger(vError_obj, 'fnDealGame', vValues_str, fnLineNumber_int(vError_obj), vIsError_bol);
  }
}

// >>>>> fnShowStart <<<<<
// Shows the start screen over the ringing phone.
function fnShowStart() {
  var vValues_str = '';
  var vIsError_bol = true;
  try {
    fnBuildLengths();
    fnShowScene(cLobbyScene_str);
    fnShowScreen('start');
  } catch (vError_obj) {
    fnMyLogger(vError_obj, 'fnShowStart', vValues_str, fnLineNumber_int(vError_obj), vIsError_bol);
  }
}

// >>>>> fnInit <<<<<
// Wires up the buttons and opens the start screen.
function fnInit() {
  var vValues_str = '';
  var vIsError_bol = true;
  try {
    gLength_int = cLengths_arr[cDefaultLengthIndex_int].count_int;
    fnElement_obj('start').addEventListener('click', fnDealGame);
    fnElement_obj('next').addEventListener('click', fnNext);
    fnElement_obj('again').addEventListener('click', fnDealGame);
    fnElement_obj('change').addEventListener('click', fnShowStart);
    fnShowStart();
  } catch (vError_obj) {
    fnMyLogger(vError_obj, 'fnInit', vValues_str, fnLineNumber_int(vError_obj), vIsError_bol);
  }
}

fnInit();
</script>
</body>
</html>
